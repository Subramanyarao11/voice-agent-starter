[project]
name = "sahaayak"
version = "0.1.0"
description = "Local-language voice utility agent for government scheme, scholarship, and job eligibility"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sahaayak-contracts",
    "sahaayak-common",
    "sahaayak-agent",
    "sahaayak-api",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]
pipeline = [
    "huggingface-hub>=0.26.0",
    "pdfplumber>=0.11.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/common",
    "services/agent",
    "services/api",
]

[tool.uv.sources]
sahaayak-contracts = { workspace = true }
sahaayak-common = { workspace = true }
sahaayak-agent = { workspace = true }
sahaayak-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `class X(str, Enum)` rather than StrEnum: this is what Pydantic and
    # SQLAlchemy's Enum column expect, and both are load-bearing here.
    "UP042",
    # `Depends(...)` in a parameter default is FastAPI's dependency-injection
    # idiom, not the mutable-default bug this rule targets.
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = [
    "sahaayak_agent",
    "sahaayak_api",
    "sahaayak_common",
    "sahaayak_contracts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
