[project]
name = "voice-utility-agent"
version = "0.1.0"
description = "Local-language voice agent for scheme/scholarship/job eligibility discovery"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "openai>=1.54.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "langfuse>=2.53.0",
    "python-dotenv>=1.0.1",
    "huggingface_hub>=0.26.0",
    "pdfplumber>=0.11.0",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
