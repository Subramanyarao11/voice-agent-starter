[project]
name = "sahaayak-api"
version = "0.1.0"
description = "FastAPI service exposing sessions, text turns, voice turns, and escalations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sahaayak-contracts",
    "sahaayak-common",
    "sahaayak-agent",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.10.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
]

[tool.uv.sources]
sahaayak-contracts = { workspace = true }
sahaayak-common = { workspace = true }
sahaayak-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahaayak_api"]
