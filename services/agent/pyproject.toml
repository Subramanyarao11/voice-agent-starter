[project]
name = "sahaayak-agent"
version = "0.1.0"
description = "LangGraph dialogue manager, eligibility matcher, and voice provider layer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sahaayak-contracts",
    "sahaayak-common",
    "langgraph>=0.2.60",
    "openai>=1.54.0",
    "httpx>=0.27.0",
    "langfuse>=2.53.0",
    "structlog>=24.4.0",
]

[tool.uv.sources]
sahaayak-contracts = { workspace = true }
sahaayak-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahaayak_agent"]
