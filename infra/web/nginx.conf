server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;
  # Local Keycloak OIDC token exchange is browser→:8080; without it in
  # connect-src the admin callback fails with a opaque "Failed to fetch".
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' http://localhost:8080; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss: http://localhost:8000 ws://localhost:8000 http://localhost:8080" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Sahaayak-Client-IP $remote_addr;
    proxy_read_timeout 90s;
  }

  location = /api/voice/stream {
    proxy_pass http://api:8000/api/voice/stream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Sahaayak-Client-IP $remote_addr;
    proxy_read_timeout 210s;
    proxy_send_timeout 30s;
    proxy_buffering off;
  }

  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
