# Static SPA for Render Free demos. Free web services cannot privately proxy
# to another free web service the way Compose does with http://api:8000.
# The browser talks to the public API via VITE_API_BASE_URL instead.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  add_header Cross-Origin-Resource-Policy "cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss:" always;

  location = /health {
    default_type text/plain;
    return 200 'ok\n';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
