[project]
name = "sahaayak-common"
version = "0.1.0"
description = "Settings, database, cache, logging, and ID minting shared by Sahaayak services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sahaayak-contracts",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
]

[tool.uv.sources]
sahaayak-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahaayak_common"]
