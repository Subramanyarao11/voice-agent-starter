[project]
name = "sahaayak-contracts"
version = "0.1.0"
description = "Infrastructure-free Pydantic contracts shared by every Sahaayak service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahaayak_contracts"]
